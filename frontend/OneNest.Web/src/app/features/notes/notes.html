<section class="page">

  <h1>Notes</h1>

  <div class="search-container">
    <input
      type="text"
      placeholder="Search notes..."
      [value]="searchText()"
      (input)="searchText.set($any($event.target).value)" />
  </div>

  <form
    [formGroup]="noteForm"
    (ngSubmit)="saveNote()">

    <div class="form-group">
      <label>Title</label>

      <input
        type="text"
        formControlName="title"
        placeholder="Enter title">
    </div>

    <div class="form-group">
      <label>Content</label>

      <textarea
        rows="5"
        formControlName="content"
        placeholder="Write your note">
      </textarea>
    </div>

    <button type="submit">
        {{ editingId() ? 'Update Note' : 'Save Note' }}
    </button>

  </form>

  <hr>

  @for (note of filteredNotes(); track note.id) {

    <div class="note-card">

  <div class="note-header">

    <h3>{{ note.title }}</h3>

    <div class="actions">

      <button
    type="button"
    class="pin-btn"
    (click)="togglePin(note.id)">

    {{ note.isPinned ? '📌' : '📍' }}

</button>
  <button
    type="button"
    class="edit-btn"
    (click)="editNote(note)">
    Edit
  </button>

  <button
    type="button"
    class="delete-btn"
    (click)="deleteNote(note.id)">
    Delete
  </button>

</div>

  </div>

  <p>{{ note.content }}</p>

</div>

  }

</section>
