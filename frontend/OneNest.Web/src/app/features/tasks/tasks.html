<section class="page">

  <h1>Tasks</h1>

  <div class="search-container">

    <input
      type="text"
      placeholder="Search tasks..."
      [value]="search()"
      (input)="search.set($any($event.target).value)" />

  </div>

  <form
    [formGroup]="taskForm"
    (ngSubmit)="saveTask()">

    <div class="form-group">

      <label>Title</label>

      <input
        type="text"
        formControlName="title"
        placeholder="Enter title">

    </div>

    <div class="form-group">

      <label>Description</label>

      <textarea
        rows="4"
        formControlName="description">
      </textarea>

    </div>

    <div class="row">

      <div class="form-group">

        <label>Due Date</label>

        <input
          type="date"
          formControlName="dueDate">

      </div>

      <div class="form-group">

        <label>Priority</label>

        <select formControlName="priority">

    <option [ngValue]="1">Low</option>

    <option [ngValue]="2">Medium</option>

    <option [ngValue]="3">High</option>

</select>

      </div>

    </div>

    <button type="submit">

      {{ editingId() ? 'Update Task' : 'Add Task' }}

    </button>

  </form>

  <hr>

  @for(task of filteredTasks(); track task.id){

    <div
      class="task-card"
      [class.completed]="task.isCompleted">

      <div class="task-header">

        <div>

          <h3>{{task.title}}</h3>

          <small>

            {{ task.dueDate ? (task.dueDate | date:'dd MMM yyyy') : 'No Due Date' }}

          </small>

        </div>

        <span
          class="priority"

          [class.high]="task.priority===3"

          [class.medium]="task.priority===2"

          [class.low]="task.priority===1">

          {{task.priority===3 ? 'High'
          : task.priority===2 ? 'Medium'
          : 'Low'}}

        </span>

      </div>

      <p>

        {{task.description}}

      </p>

      <div class="actions">

        <button
          (click)="toggleComplete(task.id)"
          type="button">

          {{task.isCompleted ? 'Undo' : 'Complete'}}

        </button>

        <button
          (click)="editTask(task)"
          type="button">

          Edit

        </button>

        <button
          (click)="deleteTask(task.id)"
          type="button">

          Delete

        </button>

      </div>

    </div>

  }

</section>
