<div class="layout">
  <aside class="sidebar">
    <div class="brand">🏡 OneNest AI</div>

    <nav class="menu">
      @for (item of menu; track item.path) {
        <a
          class="menu-item"
          [routerLink]="item.path"
          routerLinkActive="active">
          {{ item.label }}
        </a>
      }
      @if (isAdmin()) {
        <a
          class="menu-item menu-item-admin"
          routerLink="admin"
          routerLinkActive="active">
          🛡️ Admin
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      @if (currentUser(); as user) {
        <div class="user-info">
          <span class="user-name">{{ user.fullName }}</span>
          <span class="user-email">{{ user.email }}</span>
        </div>
      }
      <button class="logout-btn" type="button" (click)="logout()">Logout</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>

<app-confirm />
<app-toast />
