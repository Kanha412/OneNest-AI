<div class="layout">
  <aside class="sidebar">
    <div class="brand">🏡 OneNest AI</div>

    <nav class="menu">
      @for (item of menu; track item.path) {
        <a
          class="menu-item"
          [routerLink]="item.path"
          routerLinkActive="active">
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>

<app-confirm />
<app-toast />
