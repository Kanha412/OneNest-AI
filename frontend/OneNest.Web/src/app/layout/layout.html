<div class="layout">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard" aria-label="OneNest — go to dashboard">
      <svg class="brand-mark" viewBox="0 0 44 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M2 14 Q22 34 42 14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M8 14 Q22 28 36 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="16" cy="17" rx="4" ry="3.5" fill="currentColor"/>
        <ellipse cx="28" cy="17" rx="4" ry="3.5" fill="currentColor"/>
      </svg>
      <span class="brand-wordmark"><span class="brand-dim">One</span>Nest</span>
    </a>

    <nav class="menu">
      @for (item of menu; track item.path) {
        <a
          class="menu-item"
          [routerLink]="item.path"
          routerLinkActive="active">
          {{ item.label }}
        </a>
      }
      @if (isAdmin()) {
        <a
          class="menu-item menu-item-admin"
          routerLink="admin"
          routerLinkActive="active">
          🛡️ Admin
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      @if (currentUser(); as user) {
        <div class="user-info">
          <span class="user-name">{{ user.fullName }}</span>
          <span class="user-email">{{ user.email }}</span>
        </div>
      }
      <button class="logout-btn" type="button" (click)="logout()">Logout</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>

<app-confirm />
<app-toast />
